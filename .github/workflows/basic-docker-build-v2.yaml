---
name: Basic Docker Build v2

# Job graph (nothing is pushed to a registry before every check passes):
#
#   lint ──────────────┐
#   workflow-security ─┤
#   unit ──────────────┤
#   build ─┬─ e2e ─────┼── publish (push to main / v* tags only, GHCR)
#          └─ security ┘
#
# `build` builds the image exactly once and shares it as an artifact;
# `e2e` and `security` load that artifact instead of pulling from a registry.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # no branch filter: run the checks on every PR, including stacked PRs
  pull_request:

# default to no permissions; each job asks for the minimum it needs
permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # cancel superseded PR runs; never cancel a run on main or a tag (it may be publishing)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # local-only tag for the image under test; never pushed anywhere
  TEST_IMAGE: httpenv:ci
  IMAGE_ARTIFACT: httpenv-image

jobs:
  lint:
    name: Lint (Dockerfile, YAML, Markdown, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .github/linters/.hadolint.yaml
          # info-level findings are printed but do not fail the job
          failure-threshold: warning

      # legacy Go image, kept as the parity reference until cutover (#34)
      - name: Lint Dockerfile.go (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.go
          config: .github/linters/.hadolint.yaml
          # info-level findings are printed but do not fail the job (e.g. DL3066 non-numeric USER)
          failure-threshold: warning

      - name: Lint YAML (yamllint)
        run: |
          pipx run --spec yamllint==1.38.0 yamllint \
            --config-file .github/linters/.yaml-lint.yml \
            --format github \
            .

      - name: Set up Node.js (for markdownlint)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          # nothing to cache (no lockfile); also avoids a cache-poisoning vector
          package-manager-cache: false

      - name: Lint Markdown (markdownlint)
        # TODO: drop the ADR ignore once its two fenced blocks declare a language (MD040).
        # The ADR is owned by the #18 spike; the CI agent may not edit docs/.
        run: |
          npx --yes markdownlint-cli@0.49.1 \
            --config .github/linters/.markdown-lint.yml \
            --dot --ignore node_modules \
            --ignore docs/adr/0001-node-base-image.md \
            '**/*.md'

      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          # `run:` scripts are checked with the shellcheck preinstalled on the runner
          "${RUNNER_TEMP}/actionlint" -color

  workflow-security:
    name: Workflow security (pinned actions, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check every action is pinned to a full commit SHA
        run: |
          # allowed: owner/repo[/path]@<40-hex sha> # vX.Y.Z   (comment lets Dependabot bump it)
          #          ./local-action   docker://image@sha256:<64-hex digest>
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE 'uses:[[:space:]]*(\./|docker://[^[:space:]]+@sha256:[0-9a-f]{64})' \
            | grep -vE 'uses:[[:space:]]*[^[:space:]@]+@[0-9a-f]{40}[[:space:]]+#[[:space:]]*v?[0-9]' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Every 'uses:' must be pinned to a full 40-char commit SHA with a '# vX.Y.Z' comment"
            echo "$bad"
            exit 1
          fi
          echo "OK: all actions are pinned to a full commit SHA"

      - name: Audit workflows (zizmor)
        env:
          # online audits (impostor commits, known-vulnerable actions) need read-only API access
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.30.1 \
            --config .github/zizmor.yml \
            --format github \
            .github/workflows

  # Real unit tests arrive with the TypeScript port (#22, #23, #24).
  # Until then this job runs the checks that genuinely exist for the Go app.
  unit:
    name: 'Unit (go vet + go build; unit tests land in #22/#23)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          # no go.mod / go.sum in this repo, so there is nothing to cache
          cache: false

      - name: go vet
        run: go vet httpenv.go

      - name: go build
        run: go build -o "${RUNNER_TEMP}/httpenv" httpenv.go

  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ${{ env.TEST_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # size budget from docs/adr/0001-node-base-image.md (linux/amd64; the
      # arm64/arm-v7 images are checked by the multi-arch job, #27)
      - name: Check image size budget
        env:
          MAX_COMPRESSED_BYTES: 90000000 # 90 MB pulled from the registry
          MAX_UNPACKED_BYTES: 275000000 # 275 MB on disk
          MAX_APP_LAYER_BYTES: 1000000 # 1 MB for the application layer (/app)
        run: |
          tarball="${RUNNER_TEMP}/image.tar"
          # the exporter writes gzip-compressed layer blobs, so the archive size is
          # the compressed size plus a few KB of manifests and config
          compressed=$(stat -c %s "$tarball")
          manifest=$(tar -xOf "$tarball" index.json | jq -r '.manifests[0].digest | sub("sha256:"; "")')
          layers=$(tar -xOf "$tarball" "blobs/sha256/${manifest}" | jq -r '.layers[].digest | sub("sha256:"; "")')
          # unpacked = sum of the uncompressed layer tars (independent of the
          # daemon's image store, which may or may not count compressed blobs too)
          unpacked=0
          for layer in $layers; do
            unpacked=$(( unpacked + $(tar -xOf "$tarball" "blobs/sha256/${layer}" | gzip -dc | wc -c) ))
          done
          # the last layer is `COPY --from=build /out/app/ /app/`; measured uncompressed
          app_layer=$(tar -xOf "$tarball" "blobs/sha256/${layer}" | gzip -dc | wc -c)
          echo "compressed=${compressed} unpacked=${unpacked} app_layer=${app_layer} (bytes)"
          fail=0
          [ "$compressed" -le "$MAX_COMPRESSED_BYTES" ] || { echo "::error::compressed size ${compressed} > ${MAX_COMPRESSED_BYTES}"; fail=1; }
          [ "$unpacked" -le "$MAX_UNPACKED_BYTES" ] || { echo "::error::unpacked size ${unpacked} > ${MAX_UNPACKED_BYTES}"; fail=1; }
          [ "$app_layer" -le "$MAX_APP_LAYER_BYTES" ] || { echo "::error::app layer ${app_layer} > ${MAX_APP_LAYER_BYTES}"; fail=1; }
          exit "$fail"

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E smoke (Compose + k3d)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${RUNNER_TEMP}/image.tar"

      - name: Test healthcheck in Docker Compose
        # if the server exits while postgres is still starting, `up --exit-code-from`
        # can hang in its abort path; fail in minutes instead of at the job timeout
        timeout-minutes: 5
        env:
          TESTING_IMAGE: ${{ env.TEST_IMAGE }}
        run: |
          docker compose -f docker-compose.test.yml up --exit-code-from sut
          docker compose -f docker-compose.test.yml down --volumes

      - uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79 # v2.4.0
        with:
          cluster-name: "test-cluster-1"
          # v5.4.6 (the action's default) has no checksums.txt, which the k3d install script now requires
          k3d-version: v5.8.3
          args: >-
            --agents 1
            --no-lb
            --k3s-arg "--disable=traefik@server:*"
            --k3s-arg "--disable=servicelb@server:*"
            --k3s-arg "--disable=metrics-server@server:*"

      - name: Smoke test deployment in k3d Kubernetes
        env:
          TESTING_IMAGE: ${{ env.TEST_IMAGE }}
        run: |
          # side-load the locally built image; no registry or pull secret involved
          k3d image import "$TESTING_IMAGE" --cluster test-cluster-1
          envsubst < manifests/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment myapp --timeout=120s
          # the Node image (Debian slim) has no wget/curl: probe with node itself
          kubectl exec deploy/myapp -- node -e \
            "fetch('http://127.0.0.1:8080/').then(async (r) => { console.log(await r.text()); process.exit(r.ok ? 0 : 1); }, (e) => { console.error(e); process.exit(1); })"

  security:
    name: Security scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${RUNNER_TEMP}/image.tar"

      - name: Run Trivy for all CVEs (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          severity: CRITICAL,HIGH,MEDIUM,LOW
          image-ref: ${{ env.TEST_IMAGE }}
          exit-code: 0
          format: table

      - name: Run Trivy for all CVEs (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          severity: CRITICAL,HIGH
          image-ref: ${{ env.TEST_IMAGE }}
          exit-code: 1
          format: 'sarif'
          output: 'trivy-results.sarif'
          # without this, SARIF output reports (and fails on) every severity, not just CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        # fork PRs get a read-only token and cannot upload SARIF; the blocking scan above still gates them
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: 'trivy-results.sarif'

  publish:
    name: Publish image (GHCR)
    # every check must pass before anything is pushed
    needs: [lint, workflow-security, unit, build, e2e, security]
    # never on pull_request, so fork PRs never need registry credentials
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to ghcr.io repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/batkomahno2008/httpenv
          flavor: |
            latest=false
          # tag policy:
          #   main        -> latest + sha-<short>
          #   vX.Y.Z tag  -> X.Y.Z + X.Y + sha-<short>
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
