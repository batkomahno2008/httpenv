# kubernetes deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: "${TESTING_IMAGE}"
          # image is side-loaded with `k3d image import`; never pull from a registry
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          # rollout status waits until the server actually answers
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
